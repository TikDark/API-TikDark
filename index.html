<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Stripe Checkout</title>
  <script src="https://js.stripe.com/v3/"></script>
</head>
<body>
  <h2>Pagamento</h2>
  
  <!-- Campo para inserir o valor total -->
  <label for="total">Total: </label>
  <input type="number" id="total" placeholder="Digite o valor" value="9.54" />

  <button id="checkout-button">Pagar</button>

  <script>
    const stripe = Stripe('pk_test_51QbriAH87jQXDPGXNEnToYEiZyQ0vXiCo9or21oBjXfPQaQ5zjrXTmjAKKfYDPnptMUyH9SJBQdXOIZ5vkn4KbrQ000DoiQdWv'); // Chave pública do Stripe
    const checkoutButton = document.getElementById('checkout-button');
    const totalInput = document.getElementById('total');

    checkoutButton.addEventListener('click', () => {
      const totalValue = parseFloat(totalInput.value); // Obtém o valor inserido pelo usuário

      if (isNaN(totalValue) || totalValue <= 0) {
        alert('Por favor, insira um valor válido.');
        return;
      }

      fetch('http://localhost:3000/api/checkout', {  // Atualizando para chamar a URL correta
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({ total: totalValue }), // Envia o valor total inserido
      })
        .then((response) => response.json())
        .then((data) => {
          return stripe.redirectToCheckout({ sessionId: data.id }); // Usando o sessionId retornado
        })
        .then((result) => {
          if (result.error) {
            alert(result.error.message);
          }
        })
        .catch((error) => {
          console.error('Error:', error);
        });
    });
  </script>
</body>
</html>
